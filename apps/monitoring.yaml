apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring                      # must be lowercase with hyphens, so no underscores here
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the app deletes its resources
spec:
  project: default
  source:
    repoURL: https://github.com/mlopsomari/llm_deployment_with_monitoring
    targetRevision: main
    path: monitoring                    # the path can keep the underscore
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true