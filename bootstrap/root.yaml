apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mlopsomari/llm_deployment_with_monitoring
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd        # child Applications must be created in argocd's namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true