apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ .Release.Name }}-{{ .Values.model.name | lower | replace "/" "-" | replace "." "-" }}
  namespace: kserve

spec:
  model:
    uri: {{ .Values.model.uri }}
    name: {{ .Values.model.name }}

  replicas: 1

  template:
    tolerations:
      - key: workload
        operator: Equal
        value: llm-inference
        effect: NoSchedule

    containers:
      - name: main
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: 6Gi
            nvidia.com/gpu: "1"

  router:
    gateway: {}
    route: {}